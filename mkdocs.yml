site_name: SwarmSummerSchool 2026 Drone Documentation
site_description: Documentation for assembling, configuring, and testing algorithms on our drone platform.

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Hardware:
    - Bill of Materials: hardware/bom.md
    - Assembly:
      - Welding Guide: hardware/assembly/welding.md
      - Nipping & Wiring: hardware/assembly/nipping.md
  - Software & Configuration:
    - Firmware (PX4/ArduPilot): software/firmware.md
    - Companion Computer: software/companion_computer.md
  - Algorithm Testing:
    - Simulation: algorithms/simulation.md
    - Real Hardware Deployment: algorithms/deployment.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
